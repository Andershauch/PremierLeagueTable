name: PHP unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint changed PHP files
        run: |
          find includes premier-league-table.php tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: php tests/run-unit-tests.php
